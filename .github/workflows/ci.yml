name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Validate site configuration
        run: pnpm check:config

      - name: Check Astro and TypeScript
        run: pnpm check:types

      - name: Check Astro formatting
        run: pnpm check:astro

      - name: Check module boundaries
        run: pnpm check:boundaries

      - name: Run regression tests
        run: pnpm test

  biome:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run Biome
        run: pnpm exec biome ci . --reporter=github

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, biome]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build site
        run: pnpm exec astro build
